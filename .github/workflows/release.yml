# Build the Atlas app image and publish it to GitHub Container Registry.
#
# Why CI and not a local build: the dev machine is Windows with no Docker (see
# CLAUDE.md), so there is nowhere here to build an image. This is what makes
# "develop on Windows, run a container on the VPS" actually work — the VPS
# pulls a published image and never holds the source.
#
# The VPS then needs only three files: docker-compose.yml, .env, and
# deploy/Caddyfile. See docs/deploy-vps.md.
name: release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/<owner>/<repo>  — lowercased by the action
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs so a one-line code change doesn't
          # reinstall every dependency.
          cache-from: type=gha
          cache-to: type=gha,mode=max
