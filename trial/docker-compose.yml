services:
  realestate-trial:
    build: .
    ports:
      - "8010:8000"        # 8010 externally so it can share a VPS with stockquery (8000)
    env_file: .env
    environment:
      TZ: Asia/Kolkata
    volumes:
      - trial-data:/app/trial/data
      - trial-reports:/app/trial/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  trial-data:
  trial-reports:
