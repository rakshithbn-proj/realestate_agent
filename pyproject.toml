[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Atlas — personal AI operating system for Karnataka real estate investing (Bangalore first, Mysore data-ready)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Embedded Postgres for local tests on machines without Docker/Postgres.
    # No Windows wheels exist — on Windows, tests fall back to portable
    # binaries (see tests/_local_pg.py and README). CI uses a real Postgres.
    'pgserver>=0.1.4; sys_platform != "win32"',
]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
