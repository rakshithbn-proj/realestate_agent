[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Atlas — personal AI operating system for Karnataka real estate investing (Bangalore first, Mysore data-ready)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    # Seller-motivation extraction (atlas/scoring/motivation.py). Imported
    # lazily: with no ANTHROPIC_API_KEY the factor abstains and every other
    # part of Atlas runs untouched.
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

# Embedded Postgres, for local test runs on a machine with no Docker and no
# installed Postgres. Deliberately NOT in [dev]: it publishes no Windows
# wheels and, as of 2026-08, no cp313 build at all, so putting it there makes
# `pip install -e .[dev]` fail outright on Python 3.13 — which is exactly how
# CI broke. Nothing needs it in CI (a real pgvector service is provided via
# ATLAS_TEST_DATABASE_URL, which conftest.py prefers) and nothing needs it on
# Windows (portable binaries in .pgbin/ — see tests/_local_pg.py).
# Opt in on Linux/macOS with:  pip install -e ".[dev,localpg]"
localpg = [
    'pgserver>=0.1.4; sys_platform != "win32"',
]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
